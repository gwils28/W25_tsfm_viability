[project]
name = "w25"
version = "0.1.0"
description = "When does a zero-shot TSFM beat a refitted statistical specialist on hourly load, and how to route between them"
readme = "README.md"
authors = [
    { name = "wilson goma", email = "wilson.goma.pro@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "chronos-forecasting>=2.3",
    "holidays>=0.107",
    "matplotlib>=3.11.2",
    "pandas>=2.3.3",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "statsforecast>=2.1",
    "typer>=0.27.3",
    "utilsforecast>=0.2.17",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "tabulate>=0.10.0",
]

[project.scripts]
w25 = "w25.cli:app"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["B008"]  # typer declares options as argument defaults

[tool.ruff.lint.per-file-ignores]
"src/w25/figures_*.py" = ["E501"]  # labels and titles are text, not code
"src/w25/calendar_cov.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the real dataset or a model download"]
addopts = "-m 'not slow'"
